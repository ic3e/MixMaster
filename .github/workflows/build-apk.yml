name: Build APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '.ci-logs/**'
      - 'dist/**'
      # Notes for whoever works on this next are not a release.
      - 'CLAUDE.md'
      - 'README.md'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest runners ship with the Android SDK preinstalled
      # (ANDROID_HOME already set, licenses already accepted) — no extra
      # setup-android action needed, which removes a third-party
      # dependency as a source of failure.
      - name: Confirm Android SDK is present
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME" || (echo "::error::Android SDK not found on this runner" && exit 1)

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        id: build
        shell: bash
        env:
          # Gives every build a distinct versionCode/versionName, so installing a new APK
          # over an older one registers as an update rather than a same-version reinstall.
          MIXMASTER_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log
          exit "${PIPESTATUS[0]}"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MixMaster_1.0.${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk

      # This session's network access to GitHub Actions' own artifact
      # storage (Azure blob storage) is blocked, so also commit the APK
      # straight into the repo — that's readable via a normal git pull.
      - name: Commit APK to the repo
        if: success()
        run: |
          # The file is named for the version it carries, so the APK sitting in someone's
          # downloads says which build it is. The version name is 1.0.<run number>, set from the
          # same MIXMASTER_BUILD_NUMBER in app/build.gradle.kts, so the two can't drift apart.
          VERSION="1.0.${{ github.run_number }}"
          mkdir -p dist
          rm -f dist/*.apk
          cp app/build/outputs/apk/debug/*.apk "dist/MixMaster_$VERSION.apk"

          # The in-app updater reads this to decide whether the phone is behind. versionCode is
          # the same run number the APK was built with, so the file can't describe a build that
          # doesn't exist. json.dumps does the escaping, because a commit subject can contain
          # quotes and a hand-built JSON string would then be invalid.
          SIZE=$(stat -c%s "dist/MixMaster_$VERSION.apk")
          NOTES=$(git log -1 --pretty=%s)
          RUN="${{ github.run_number }}"
          python3 -c 'import json,sys; v,r,z,n = sys.argv[1], int(sys.argv[2]), int(sys.argv[3]), sys.argv[4]; print(json.dumps({"versionCode": r, "versionName": v, "apk": "MixMaster_" + v + ".apk", "url": "https://raw.githubusercontent.com/ic3e/MixMaster/main/dist/MixMaster_" + v + ".apk", "sizeBytes": z, "notes": n}, indent=2))' "$VERSION" "$RUN" "$SIZE" "$NOTES" > dist/latest.json
          cat dist/latest.json

          git config user.email "ci-bot@users.noreply.github.com"
          git config user.name "CI Bot"
          git add -A dist
          git add -f app/schemas || true
          git commit -m "ci: publish MixMaster_$VERSION.apk" || echo "nothing to commit"
          git push origin HEAD:${{ github.ref_name }}

      # This session's network access to GitHub Actions' own log/artifact
      # storage (Azure blob storage) is blocked, so on failure we commit
      # the log straight into the repo instead — that's readable via a
      # normal git pull / the Contents API.
      - name: Save failure log to the repo
        if: failure()
        run: |
          mkdir -p .ci-logs
          cp /tmp/gradle.log .ci-logs/last-failure.log
          git config user.email "ci-bot@users.noreply.github.com"
          git config user.name "CI Bot"
          git add .ci-logs/last-failure.log
          git commit -m "ci: save build failure log" || echo "nothing to commit"
          git push origin HEAD:${{ github.ref_name }}
