name: Build APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '.ci-logs/**'
      - 'dist/**'
      # Notes for whoever works on this next are not a release.
      - 'CLAUDE.md'
      - 'README.md'
      - 'docs/**'
      # Car Mech, the garage game, is built by a workflow of its own (build-carmech.yml).
      - 'carmech/**'
      - '.github/workflows/build-carmech.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest runners ship with the Android SDK preinstalled
      # (ANDROID_HOME already set, licenses already accepted) — no extra
      # setup-android action needed, which removes a third-party
      # dependency as a source of failure.
      - name: Confirm Android SDK is present
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME" || (echo "::error::Android SDK not found on this runner" && exit 1)

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # the Android Gradle plugin 8.10 needs Gradle 8.11.1 or later
          gradle-version: 8.11.1

      - name: Build debug APK
        id: build
        shell: bash
        env:
          # Gives every build a distinct versionCode/versionName, so installing a new APK
          # over an older one registers as an update rather than a same-version reinstall.
          MIXMASTER_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set +e
          # The copies passed round as files; the Google Play builds come in their own step below.
          gradle assembleDirectDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log
          exit "${PIPESTATUS[0]}"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MixMaster_1.0.${{ github.run_number }}
          path: |
            app/build/outputs/apk/direct/debug/*.apk
            pourday/build/outputs/apk/direct/debug/*.apk

      # Pour Day and MixMaster for Google Play: app bundles, not debuggable, with no self-update (the
      # "play" builds in pourday/ and app/build.gradle.kts). Signed with the upload key once the
      # repository has it as secrets — PLAY_UPLOAD_KEYSTORE_BASE64 and PLAY_UPLOAD_PASSWORD, see
      # docs/pourday-google-play.md; without them they are still built, unsigned, to show that they
      # build, and not kept. A step of its own that may fail: it never holds back the daily build.
      - name: Build for Google Play
        id: play
        if: success()
        continue-on-error: true
        shell: bash
        env:
          MIXMASTER_BUILD_NUMBER: ${{ github.run_number }}
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_UPLOAD_PASSWORD: ${{ secrets.PLAY_UPLOAD_PASSWORD }}
        run: |
          set -o pipefail
          SIGNED=""
          if [ -n "$PLAY_UPLOAD_KEYSTORE_BASE64" ] && [ -n "$PLAY_UPLOAD_PASSWORD" ]; then
            export PLAY_UPLOAD_KEYSTORE="$RUNNER_TEMP/pourday-upload.jks"
            echo "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$PLAY_UPLOAD_KEYSTORE"
            SIGNED=yes
          fi
          # --continue: one app's bundle failing doesn't stop the other's, and whatever did build is
          # still listed and kept below before the step reports the failure
          set +e
          gradle :pourday:bundlePlayRelease :app:bundlePlayRelease --continue --no-daemon --stacktrace 2>&1 | tee /tmp/play.log
          STATUS=${PIPESTATUS[0]}
          set -e
          rm -f "$RUNNER_TEMP/pourday-upload.jks"
          # The permissions each Play build asks for, as its merged manifest has them — libraries'
          # included: what the store listing, the privacy policy and the Data safety form must match.
          mkdir -p .ci-logs
          : > .ci-logs/play-permissions.txt
          for module in pourday app; do
            MANIFEST=$(find $module/build/intermediates -path '*playRelease*' -name AndroidManifest.xml | head -n 1)
            [ -n "$MANIFEST" ] || continue
            echo "[$module]" >> .ci-logs/play-permissions.txt
            python3 - "$MANIFEST" >> .ci-logs/play-permissions.txt <<'PY'
          import sys, xml.etree.ElementTree as ET
          A = '{http://schemas.android.com/apk/res/android}'
          for e in ET.parse(sys.argv[1]).getroot():
              if e.tag.startswith('uses-permission'):
                  top = e.get(A + 'maxSdkVersion')
                  print(e.get(A + 'name') + (' (up to API ' + top + ')' if top else ''))
          PY
          done
          cat .ci-logs/play-permissions.txt
          if [ -n "$SIGNED" ]; then
            # Only the newest bundles are kept: Play wants each upload's number higher than the last.
            mkdir -p dist/play
            rm -f dist/play/*.aab
            for pair in "pourday PourDay" "app MixMaster"; do
              set -- $pair
              BUNDLE=$(ls $1/build/outputs/bundle/playRelease/*.aab 2>/dev/null | head -n 1)
              if [ -n "$BUNDLE" ]; then cp "$BUNDLE" "dist/play/$2_1.0.${{ github.run_number }}.aab"; fi
            done
          else
            echo "No upload key in the repository's secrets: the Play bundles were built unsigned and not kept."
          fi
          exit $STATUS

      # This session's network access to GitHub Actions' own artifact
      # storage (Azure blob storage) is blocked, so also commit the APK
      # straight into the repo — that's readable via a normal git pull.
      - name: Commit APK to the repo
        if: success()
        run: |
          # The file is named for the version it carries, so the APK sitting in someone's
          # downloads says which build it is. The version name is 1.0.<run number>, set from the
          # same MIXMASTER_BUILD_NUMBER in app/build.gradle.kts, so the two can't drift apart.
          VERSION="1.0.${{ github.run_number }}"
          mkdir -p dist
          # The build before this one stays for one more round. GitHub serves raw files from a
          # cache for a few minutes, so a phone checking just after this lands can still be handed
          # the old latest.json, and the APK it names has to still be there to download.
          for app in MixMaster PourDay; do
            ls -1 dist/${app}_1.0.*.apk 2>/dev/null | sort -t. -k3 -n | head -n -1 | xargs -r rm -f
          done
          cp app/build/outputs/apk/direct/debug/*.apk "dist/MixMaster_$VERSION.apk"
          # Pour Day on its own, for people outside the company: built from the same run, so it
          # carries the same game as the MixMaster beside it.
          cp pourday/build/outputs/apk/direct/debug/*.apk "dist/PourDay_$VERSION.apk"

          # The in-app updater reads this to decide whether the phone is behind. versionCode is
          # the same run number the APK was built with, so the file can't describe a build that
          # doesn't exist. json.dumps does the escaping, because a commit subject can contain
          # quotes and a hand-built JSON string would then be invalid.
          SIZE=$(stat -c%s "dist/MixMaster_$VERSION.apk")
          NOTES=$(git log -1 --pretty=%s)
          RUN="${{ github.run_number }}"
          python3 -c 'import json,sys; v,r,z,n = sys.argv[1], int(sys.argv[2]), int(sys.argv[3]), sys.argv[4]; print(json.dumps({"versionCode": r, "versionName": v, "apk": "MixMaster_" + v + ".apk", "url": "https://raw.githubusercontent.com/ic3e/MixMaster/main/dist/MixMaster_" + v + ".apk", "sizeBytes": z, "notes": n}, indent=2))' "$VERSION" "$RUN" "$SIZE" "$NOTES" > dist/latest.json
          cat dist/latest.json

          # The same for the Pour Day app, which reads it from inside the game. "game" is the stamp of
          # the game this APK carries (written by the :game build): Pour Day offers its players an
          # update only when that has changed, not every time MixMaster is rebuilt.
          PD_SIZE=$(stat -c%s "dist/PourDay_$VERSION.apk")
          PD_GAME=$(cat game/build/game-stamp.txt)
          python3 -c 'import json,sys; v,r,z,g = sys.argv[1], int(sys.argv[2]), int(sys.argv[3]), sys.argv[4]; print(json.dumps({"versionCode": r, "versionName": v, "game": g, "apk": "PourDay_" + v + ".apk", "url": "https://raw.githubusercontent.com/ic3e/MixMaster/main/dist/PourDay_" + v + ".apk", "sizeBytes": z}, indent=2))' "$VERSION" "$RUN" "$PD_SIZE" "$PD_GAME" > dist/pourday.json
          cat dist/pourday.json

          # The compiler's warnings (a variable never read, a parameter never used, a call to
          # something deprecated) — the only compiler the code ever meets is this one, so what
          # it says is kept where the next change can read it.
          mkdir -p .ci-logs
          # the Play builds' own code (src/play) is compiled only in their step: its warnings count too
          cat /tmp/gradle.log /tmp/play.log 2>/dev/null | grep -E '^w: ' | sed -E 's#file:///home/runner/work/[^/]+/[^/]+/##' | sort -u > .ci-logs/warnings.log || true
          echo "$(wc -l < .ci-logs/warnings.log) compiler warnings"

          git config user.email "ci-bot@users.noreply.github.com"
          git config user.name "CI Bot"
          # How the Google Play build went: its log when it failed, so the next change can read why.
          if [ "${{ steps.play.outcome }}" = "failure" ]; then
            cp /tmp/play.log .ci-logs/play-failure.log
          else
            rm -f .ci-logs/play-failure.log
          fi

          git add -A dist
          git add -A .ci-logs
          git add -f app/schemas || true
          git commit -m "ci: publish MixMaster_$VERSION.apk and PourDay_$VERSION.apk" || echo "nothing to commit"
          # Car Mech's workflow may have committed its APK in the meantime: go on top of it
          for i in 1 2 3 4 5; do
            git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && exit 0
            sleep $((i * 3))
          done
          exit 1

      # This session's network access to GitHub Actions' own log/artifact
      # storage (Azure blob storage) is blocked, so on failure we commit
      # the log straight into the repo instead — that's readable via a
      # normal git pull / the Contents API.
      - name: Save failure log to the repo
        if: failure()
        run: |
          mkdir -p .ci-logs
          cp /tmp/gradle.log .ci-logs/last-failure.log
          git config user.email "ci-bot@users.noreply.github.com"
          git config user.name "CI Bot"
          git add .ci-logs/last-failure.log
          git commit -m "ci: save build failure log" || echo "nothing to commit"
          for i in 1 2 3 4 5; do
            git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && exit 0
            sleep $((i * 3))
          done
