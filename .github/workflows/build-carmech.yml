name: Build Car Mech

# Car Mech, the garage game, is a Gradle build of its own (carmech/). It is built here, apart from
# MixMaster's workflow, only when something in it changes: a change to the game never cuts a
# MixMaster release, and a mistake in it can never hold back the MixMaster the crew installs daily.
on:
  push:
    branches: [ main, master ]
    paths:
      - 'carmech/**'
      - '.github/workflows/build-carmech.yml'
  workflow_dispatch: {}

permissions:
  contents: write

# one build of the game at a time, so two of them never race to commit the APK
concurrency:
  group: carmech
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build debug APK
        shell: bash
        env:
          # its own run number: every APK installs over the one before it
          CARMECH_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set +e
          gradle -p carmech assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/carmech.log
          exit "${PIPESTATUS[0]}"

      # The APK goes into the repository, as MixMaster's does: readable with a plain git pull.
      - name: Commit APK to the repo
        if: success()
        shell: bash
        run: |
          VERSION="1.0.${{ github.run_number }}"
          mkdir -p dist .ci-logs
          # the build before this one stays for one more round, as with the other apps (the step runs
          # with pipefail, and on the very first build there is no earlier one for ls to find)
          ls -1 dist/CarMech_1.0.*.apk 2>/dev/null | sort -t. -k3 -n | head -n -1 | xargs -r rm -f || true
          cp carmech/build/outputs/apk/debug/*.apk "dist/CarMech_$VERSION.apk"
          # the compiler's warnings: the only compiler this code meets
          grep -E '^w: ' /tmp/carmech.log | sed -E 's#file:///home/runner/work/[^/]+/[^/]+/##' | sort -u > .ci-logs/carmech-warnings.log || true
          echo "$(wc -l < .ci-logs/carmech-warnings.log) compiler warnings"
          rm -f .ci-logs/carmech-failure.log
          git config user.email "ci-bot@users.noreply.github.com"
          git config user.name "CI Bot"
          git add -A dist .ci-logs
          git commit -m "ci: publish CarMech_$VERSION.apk" || echo "nothing to commit"
          # MixMaster's workflow may have committed in the meantime: go on top of it
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep $((i * 3))
          done
          exit 1

      - name: Save failure log to the repo
        if: failure()
        shell: bash
        run: |
          mkdir -p .ci-logs
          cp /tmp/carmech.log .ci-logs/carmech-failure.log
          git config user.email "ci-bot@users.noreply.github.com"
          git config user.name "CI Bot"
          git add .ci-logs/carmech-failure.log
          git commit -m "ci: save Car Mech build failure log" || echo "nothing to commit"
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep $((i * 3))
          done
